name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 22.23.4
        env:
          # The existing custom domain is https://alhejab.me.
          # Override with a repository variable named SITE_URL if it changes.
          SITE_URL: ${{ vars.SITE_URL || 'https://alhejab.me' }}
          # Sample posts are drafts. Keep this true for the demo site, or
          # remove it (or set it to false) once you publish real posts.
          PUBLIC_INCLUDE_DRAFTS: "true"
          # Set a repository secret named SITE_PASSWORD before launch.
          SITE_GATE: "true"
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD || 'aalhejab' }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
