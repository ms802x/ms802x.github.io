name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 22.23.4
        env:
          # The alhejab.me domain is currently not resolving.
          # Override with a repository variable named SITE_URL when it is restored.
          SITE_URL: ${{ vars.SITE_URL || 'https://ms802x.github.io' }}
          # Posts with draft: true are not published.
          PUBLIC_INCLUDE_DRAFTS: "false"
          # Comments (giscus). Set these as repository variables; comments stay off until they exist.
          PUBLIC_GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
