name: Configure Pages source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set GitHub Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Current Pages settings:"
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true
          echo
          echo "Updating build_type to workflow:"
          curl -sS --fail-with-body -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}'
