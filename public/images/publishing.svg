<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Research publishing pipeline illustration</title>
  <desc id="desc">A paper moving through experiments, writing, review, and revision, with IEEE and Springer stamps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1012"/>
      <stop offset="1" stop-color="#131311"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="830" cy="290" r="300" fill="url(#glow)"/>
  <g opacity=".12" stroke="#e8d9b6">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/>
  </g>
  <text x="70" y="76" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">07 / PUBLISHING</text>
  <text x="1130" y="76" fill="#827c6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="end">RESEARCH OPS</text>

  <g transform="translate(70 150)">
    <g transform="rotate(-4 150 160)">
      <rect x="0" y="0" width="300" height="324" rx="8" fill="#f2eee4"/>
      <rect x="26" y="32" width="160" height="10" rx="4" fill="#1b1b18"/>
      <rect x="26" y="54" width="220" height="6" rx="3" fill="#b9b4a8"/>
      <rect x="26" y="70" width="190" height="6" rx="3" fill="#b9b4a8"/>
      <rect x="26" y="104" width="248" height="3" rx="1.5" fill="#d4cfc3"/>
      <rect x="26" y="118" width="230" height="3" rx="1.5" fill="#d4cfc3"/>
      <rect x="26" y="132" width="242" height="3" rx="1.5" fill="#d4cfc3"/>
      <rect x="26" y="146" width="190" height="3" rx="1.5" fill="#d4cfc3"/>
      <rect x="26" y="180" width="120" height="74" rx="3" fill="#ded8ca"/>
      <path d="M40 238l28-42 24 30 16-18 18 30z" fill="#9d9a8e"/>
      <rect x="164" y="184" width="108" height="6" rx="3" fill="#b9b4a8"/>
      <rect x="164" y="198" width="88" height="6" rx="3" fill="#b9b4a8"/>
      <rect x="164" y="212" width="98" height="6" rx="3" fill="#b9b4a8"/>
      <rect x="26" y="280" width="248" height="3" rx="1.5" fill="#d4cfc3"/>
      <rect x="26" y="294" width="200" height="3" rx="1.5" fill="#d4cfc3"/>
    </g>
    <g transform="translate(318 44) rotate(3 108 150)">
      <rect x="0" y="0" width="216" height="270" rx="8" fill="#e9e4d7"/>
      <rect x="22" y="26" width="120" height="8" rx="3" fill="#2a2924"/>
      <rect x="22" y="46" width="170" height="4" rx="2" fill="#b9b4a8"/>
      <rect x="22" y="58" width="152" height="4" rx="2" fill="#b9b4a8"/>
      <rect x="22" y="90" width="172" height="60" rx="3" fill="#d7d1c1"/>
      <rect x="22" y="166" width="172" height="4" rx="2" fill="#c3bdae"/>
      <rect x="22" y="180" width="142" height="4" rx="2" fill="#c3bdae"/>
      <rect x="22" y="194" width="160" height="4" rx="2" fill="#c3bdae"/>
    </g>
  </g>

  <g transform="translate(542 158)">
    <g fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">
      <text x="0" y="0">REVIEW</text>
    </g>
    <g stroke="#5d4c26" stroke-width="1.5">
      <path d="M0 24h520M0 88h520M0 152h520M0 216h520" stroke-dasharray="3 7"/>
    </g>
    <g fill="#d8c48e" font-family="ui-sans-serif, sans-serif" font-size="16">
      <text x="0" y="56">Experiments + evidence</text>
      <text x="0" y="120">Writing + reproducibility</text>
      <text x="0" y="184">Peer review</text>
      <text x="0" y="248">Revision + resubmission</text>
    </g>
    <g fill="#6b5b30">
      <circle cx="360" cy="52" r="5"/><circle cx="360" cy="116" r="5"/><circle cx="360" cy="180" r="5"/><circle cx="360" cy="244" r="5"/>
    </g>
  </g>

  <g transform="translate(548 448)">
    <rect x="0" y="0" width="238" height="66" rx="9" fill="#1a1710" stroke="#5d4c26"/>
    <text x="18" y="27" fill="#7d6e47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="2">PUBLISHER</text>
    <text x="18" y="49" fill="#f4e6c2" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">IEEE</text>
    <rect x="284" y="0" width="238" height="66" rx="9" fill="#1a1710" stroke="#5d4c26"/>
    <text x="302" y="27" fill="#7d6e47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="2">PUBLISHER</text>
    <text x="302" y="49" fill="#f4e6c2" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="600">Springer</text>
  </g>

  <text x="70" y="548" fill="#f7f3e9" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="39" font-weight="600" letter-spacing="-1.3">Plan for the revision before you submit.</text>
  <text x="70" y="590" fill="#a99f88" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="20">Review time is engineering time, not an afterthought.</text>
  <text x="70" y="638" fill="#6e6654" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SAMPLE VISUAL / ILLUSTRATIVE</text>
</svg>
