<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Real-time voice agent latency loop</title>
  <desc id="desc">A circular voice pipeline with speech-to-text, language model, and text-to-speech stages and a p95 latency budget.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1113"/>
      <stop offset="1" stop-color="#101616"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="660" cy="300" r="320" fill="url(#glow)"/>
  <g opacity=".14" stroke="#8de9dc">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/>
  </g>
  <text x="70" y="76" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">06 / VOICE LOOP</text>
  <text x="1130" y="76" fill="#74908c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="end">P95 BUDGET</text>

  <g transform="translate(620 310)">
    <circle cx="0" cy="0" r="196" fill="none" stroke="#243b39" stroke-dasharray="3 8"/>
    <circle cx="0" cy="0" r="118" fill="#0f1b1a" stroke="#2d4a47"/>
    <text x="0" y="-8" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" letter-spacing="2">TURN LOOP</text>
    <text x="0" y="22" fill="#f1faf8" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="28" font-weight="600" text-anchor="middle">~900 ms</text>
    <text x="0" y="45" fill="#6d8985" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">target p95</text>

    <g transform="translate(-196 0)">
      <rect x="-76" y="-38" width="152" height="76" rx="13" fill="#12211f" stroke="#2d4a47"/>
      <text x="0" y="-8" fill="#9ec4be" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">01</text>
      <text x="0" y="18" fill="#e5f4f1" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="600" text-anchor="middle">STT</text>
    </g>
    <g transform="translate(170 -120)">
      <rect x="-72" y="-38" width="144" height="76" rx="13" fill="#12211f" stroke="#2d4a47"/>
      <text x="0" y="-8" fill="#9ec4be" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">02</text>
      <text x="0" y="18" fill="#e5f4f1" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="600" text-anchor="middle">LLM</text>
    </g>
    <g transform="translate(170 120)">
      <rect x="-72" y="-38" width="144" height="76" rx="13" fill="#12211f" stroke="#2d4a47"/>
      <text x="0" y="-8" fill="#9ec4be" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">03</text>
      <text x="0" y="18" fill="#e5f4f1" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="600" text-anchor="middle">TTS</text>
    </g>
    <g fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)" opacity=".8">
      <path d="M-118 -22C-70 -100 80 -146 104 -118"/>
      <path d="M188 -78C226 -28 226 50 200 90"/>
      <path d="M98 132C44 166 -48 150 -72 92"/>
    </g>
    <g fill="#7ea49e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
      <text x="-176" y="-68">180 ms</text><text x="204" y="-104">320 ms</text><text x="200" y="150">210 ms</text>
    </g>
  </g>

  <g transform="translate(70 185)">
    <text x="0" y="0" fill="#88a6a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">STAGE BUDGET</text>
    <g>
      <text x="0" y="42" fill="#d7e9e5" font-family="ui-sans-serif, sans-serif" font-size="18">STT</text>
      <rect x="0" y="56" width="330" height="7" rx="3.5" fill="#1a2b29"/><rect x="0" y="56" width="126" height="7" rx="3.5" fill="#5eead4"/>
      <text x="350" y="63" fill="#6d8985" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">180</text>
      <text x="0" y="92" fill="#d7e9e5" font-family="ui-sans-serif, sans-serif" font-size="18">LLM</text>
      <rect x="0" y="106" width="330" height="7" rx="3.5" fill="#1a2b29"/><rect x="0" y="106" width="224" height="7" rx="3.5" fill="#fbbf24"/>
      <text x="350" y="113" fill="#6d8985" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">320</text>
      <text x="0" y="142" fill="#d7e9e5" font-family="ui-sans-serif, sans-serif" font-size="18">TTS</text>
      <rect x="0" y="156" width="330" height="7" rx="3.5" fill="#1a2b29"/><rect x="0" y="156" width="147" height="7" rx="3.5" fill="#fb7185"/>
      <text x="350" y="163" fill="#6d8985" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">210</text>
    </g>
  </g>

  <text x="70" y="548" fill="#eff8f6" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="39" font-weight="600" letter-spacing="-1.3">Instrument the turn, not just the model.</text>
  <text x="70" y="590" fill="#9bb3af" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="20">Reconnects, barge-in, and stale audio are architecture problems.</text>
  <text x="70" y="638" fill="#5f7773" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SAMPLE VISUAL / ILLUSTRATIVE</text>
</svg>
