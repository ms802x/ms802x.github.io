<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Diffusion sampling latency illustration</title>
  <desc id="desc">A sequence of noisy frames collapsing into a clean image, beside a latency chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1213"/>
      <stop offset="1" stop-color="#101b1b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8de9dc" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1000" cy="230" r="300" fill="url(#glow)"/>
  <text x="70" y="76" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">01 / DIFFUSION</text>
  <text x="1130" y="76" fill="#78918e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="end">INFERENCE BUDGET</text>

  <g transform="translate(74 150)">
    <g fill="#101b1b" stroke="#2d4543">
      <rect x="0" y="0" width="132" height="170" rx="14"/>
      <rect x="166" y="0" width="132" height="170" rx="14"/>
      <rect x="332" y="0" width="132" height="170" rx="14"/>
      <rect x="498" y="0" width="132" height="170" rx="14"/>
    </g>
    <g fill="#5eead4">
      <circle cx="34" cy="38" r="4" opacity=".45"/><circle cx="86" cy="25" r="3" opacity=".7"/><circle cx="110" cy="63" r="5" opacity=".25"/>
      <circle cx="55" cy="91" r="3" opacity=".55"/><circle cx="93" cy="112" r="6" opacity=".2"/><circle cx="28" cy="132" r="2" opacity=".7"/>
    </g>
    <g fill="#5eead4" opacity=".75">
      <circle cx="198" cy="31" r="3"/><circle cx="245" cy="55" r="2"/><circle cx="213" cy="84" r="4"/><circle cx="270" cy="112" r="2"/>
      <circle cx="238" cy="139" r="3"/><circle cx="192" cy="120" r="2"/>
    </g>
    <g fill="#5eead4" opacity=".9">
      <circle cx="398" cy="52" r="2"/><circle cx="424" cy="77" r="3"/><circle cx="387" cy="108" r="2"/><circle cx="435" cy="130" r="2"/>
    </g>
    <rect x="498" y="0" width="132" height="170" rx="14" fill="#164e48" stroke="#5eead4"/>
    <path d="M514 128c22-58 44-63 58-38 12 20 22 15 42-22v72h-100z" fill="url(#teal)" opacity=".85"/>
    <circle cx="626" cy="110" r="11" fill="#fbbf24"/>
    <g fill="#8ba6a2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
      <text x="66" y="202">NOISE</text>
      <text x="232" y="202">STEP 1</text>
      <text x="398" y="202">STEP 2</text>
      <text x="564" y="202">OUTPUT</text>
    </g>
  </g>

  <g transform="translate(744 170)">
    <text x="0" y="0" fill="#8ba6a2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">LATENCY / MS</text>
    <g>
      <rect x="0" y="30" width="86" height="174" rx="7" fill="#1a2c2a"/>
      <rect x="0" y="116" width="86" height="88" rx="7" fill="#0d9488"/>
      <rect x="118" y="30" width="86" height="174" rx="7" fill="#1a2c2a"/>
      <rect x="118" y="84" width="86" height="120" rx="7" fill="#14b8a6"/>
      <rect x="236" y="30" width="86" height="174" rx="7" fill="#1a2c2a"/>
      <rect x="236" y="64" width="86" height="140" rx="7" fill="#5eead4"/>
    </g>
    <g fill="#8ba6a2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
      <text x="43" y="228">50 steps</text>
      <text x="161" y="228">20 steps</text>
      <text x="279" y="228">8 steps</text>
    </g>
    <g stroke="#2d4543" stroke-dasharray="4 6">
      <line x1="0" y1="250" x2="322" y2="250"/>
    </g>
  </g>

  <text x="70" y="455" fill="#edf7f4" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="40" font-weight="600" letter-spacing="-1.4">Fewer steps is only half the story.</text>
  <text x="70" y="497" fill="#9eb4b0" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="21">Measure the denoiser, scheduler, and transfers separately.</text>
  <text x="70" y="610" fill="#5f7773" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SAMPLE VISUAL / ILLUSTRATIVE</text>
</svg>
