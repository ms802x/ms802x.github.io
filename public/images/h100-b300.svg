<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">H100 versus B300 serving illustration</title>
  <desc id="desc">Two GPU cards compared with throughput bars under a latency constraint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f12"/>
      <stop offset="1" stop-color="#131416"/>
    </linearGradient>
    <linearGradient id="gpu-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3c3a"/>
      <stop offset="1" stop-color="#102322"/>
    </linearGradient>
    <linearGradient id="gpu-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3521"/>
      <stop offset="1" stop-color="#211d13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="960" cy="210" r="300" fill="url(#glow)"/>
  <g opacity=".16" stroke="#9bb5b6">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/>
  </g>
  <text x="70" y="76" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">05 / SERVING</text>
  <text x="1130" y="76" fill="#817c6d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="end">COST AT LATENCY SLO</text>

  <g transform="translate(70 150)">
    <rect x="0" y="0" width="480" height="210" rx="18" fill="url(#gpu-a)" stroke="#2f5752"/>
    <text x="24" y="38" fill="#8eb6b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">H100</text>
    <text x="456" y="38" fill="#5d7a77" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end">HOPPER</text>
    <g>
      <rect x="24" y="66" width="432" height="10" rx="5" fill="#0b1a19"/>
      <rect x="24" y="66" width="238" height="10" rx="5" fill="#5eead4"/>
      <rect x="24" y="98" width="432" height="10" rx="5" fill="#0b1a19"/>
      <rect x="24" y="98" width="176" height="10" rx="5" fill="#2dd4bf"/>
      <rect x="24" y="130" width="432" height="10" rx="5" fill="#0b1a19"/>
      <rect x="24" y="130" width="322" height="10" rx="5" fill="#14b8a6"/>
    </g>
    <g fill="#668985" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
      <text x="24" y="174">PREFILL</text><text x="24" y="188" fill="#42605d">batch 8 · 2k ctx</text>
      <text x="270" y="174">DECODE</text><text x="270" y="188" fill="#42605d">42 tok/s</text>
    </g>
  </g>

  <g transform="translate(650 150)">
    <rect x="0" y="0" width="480" height="210" rx="18" fill="url(#gpu-b)" stroke="#6b5b30"/>
    <text x="24" y="38" fill="#d8c48e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">B300</text>
    <text x="456" y="38" fill="#7d6e47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end">BLACKWELL ULTRA</text>
    <g>
      <rect x="24" y="66" width="432" height="10" rx="5" fill="#1c1810"/>
      <rect x="24" y="66" width="382" height="10" rx="5" fill="#fbbf24"/>
      <rect x="24" y="98" width="432" height="10" rx="5" fill="#1c1810"/>
      <rect x="24" y="98" width="362" height="10" rx="5" fill="#f59e0b"/>
      <rect x="24" y="130" width="432" height="10" rx="5" fill="#1c1810"/>
      <rect x="24" y="130" width="398" height="10" rx="5" fill="#fcd34d"/>
    </g>
    <g fill="#8e7f55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
      <text x="24" y="174">PREFILL</text><text x="24" y="188" fill="#5e5438">batch 8 · 2k ctx</text>
      <text x="270" y="174">DECODE</text><text x="270" y="188" fill="#5e5438">higher ceiling</text>
    </g>
  </g>

  <g transform="translate(70 414)">
    <rect x="0" y="0" width="1060" height="70" rx="12" fill="#111718" stroke="#2b3638"/>
    <text x="20" y="28" fill="#738b8d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">RULE</text>
    <text x="20" y="53" fill="#e6efed" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="20" font-weight="500">Compare cost per million tokens at the same p95 latency target.</text>
  </g>

  <text x="70" y="558" fill="#f3f5ef" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="39" font-weight="600" letter-spacing="-1.3">Peak throughput is not served cost.</text>
  <text x="70" y="600" fill="#9ba4a0" font-family="'Instrument Sans', ui-sans-serif, sans-serif" font-size="20">Queueing, batching, and context length decide the economics.</text>
  <text x="70" y="642" fill="#626c69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SAMPLE VISUAL / ILLUSTRATIVE</text>
</svg>
