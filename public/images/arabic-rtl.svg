<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Arabic diffusion inference illustration</title>
  <desc id="desc">Arabic typography surrounded by diffusion steps and a latency curve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1112"/>
      <stop offset="1" stop-color="#101a18"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8de9dc" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="600" cy="300" r="360" fill="url(#glow)"/>
  <text x="70" y="76" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">08 / RTL SAMPLE</text>
  <text x="1130" y="76" fill="#77918d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="end">LANG = AR / DIR = RTL</text>

  <g opacity=".5" fill="none" stroke="#5eead4">
    <circle cx="600" cy="298" r="248" stroke-opacity=".08"/>
    <circle cx="600" cy="298" r="196" stroke-opacity=".12"/>
    <circle cx="600" cy="298" r="144" stroke-opacity=".18"/>
    <circle cx="600" cy="298" r="92" stroke-opacity=".24"/>
  </g>

  <text x="600" y="330" fill="#effcf9" font-family="'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="96" font-weight="600" text-anchor="middle" direction="rtl">الانتشار</text>
  <text x="600" y="384" fill="#78a39c" font-family="'Noto Sans Arabic', 'Geeza Pro', sans-serif" font-size="23" text-anchor="middle" direction="rtl">خطوات أقل، قياس أدق</text>

  <g transform="translate(100 235)">
    <g fill="none" stroke="#5eead4">
      <circle cx="0" cy="0" r="7" fill="#5eead4"/>
      <circle cx="0" cy="0" r="34" stroke-opacity=".25"/>
      <circle cx="0" cy="0" r="58" stroke-opacity=".12"/>
    </g>
    <text x="0" y="96" fill="#6e8b86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">NOISE</text>
  </g>

  <g transform="translate(1100 235)">
    <g fill="none" stroke="#5eead4">
      <circle cx="0" cy="0" r="7" fill="#5eead4"/>
      <circle cx="0" cy="0" r="34" stroke-opacity=".25"/>
      <circle cx="0" cy="0" r="58" stroke-opacity=".12"/>
    </g>
    <text x="0" y="96" fill="#6e8b86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">OUTPUT</text>
  </g>

  <g transform="translate(70 486)">
    <text x="0" y="0" fill="#7a9993" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">LATENCY / STEP COUNT</text>
    <path d="M0 72C90 66 160 44 250 30S390 14 490 10" fill="none" stroke="#5eead4" stroke-width="2.5"/>
    <path d="M0 72C90 66 160 44 250 30S390 14 490 10V88H0Z" fill="#5eead4" fill-opacity=".06"/>
    <g fill="#5eead4">
      <circle cx="0" cy="72" r="4"/><circle cx="250" cy="30" r="4"/><circle cx="490" cy="10" r="4"/>
    </g>
    <g fill="#66847e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
      <text x="0" y="106">50</text><text x="238" y="106">20</text><text x="476" y="106">8</text>
    </g>
  </g>

  <g transform="translate(700 486)">
    <rect x="0" y="0" width="430" height="86" rx="10" fill="#101b19" stroke="#2b4a45"/>
    <text x="18" y="27" fill="#6e8b86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="2">الزمن الكلي</text>
    <text x="18" y="60" fill="#e4f7f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" direction="ltr">T ≈ N × (T_denoise + T_scheduler)</text>
  </g>

  <text x="70" y="628" fill="#5a716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SAMPLE VISUAL / ILLUSTRATIVE</text>
</svg>
