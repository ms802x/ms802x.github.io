<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Arabic ASR benchmark illustration</title>
  <desc id="desc">A waveform split into clean, dialect, and noisy slices with word error rates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1114"/>
      <stop offset="1" stop-color="#101a1d"/>
